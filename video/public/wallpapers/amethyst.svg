<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="30%" stop-color="#2d1154"/>
      <stop offset="50%" stop-color="#3b1a6e"/>
      <stop offset="70%" stop-color="#2a1250"/>
      <stop offset="100%" stop-color="#140228"/>
    </linearGradient>
    <radialGradient id="c1" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c3" cx="50%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c4" cx="25%" cy="45%" r="22%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c5" cx="75%" cy="35%" r="20%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <!-- Crystal refraction lines -->
    <linearGradient id="ref1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#c1)"/>
  <rect width="1920" height="1080" fill="url(#c2)"/>
  <rect width="1920" height="1080" fill="url(#c3)"/>
  <rect width="1920" height="1080" fill="url(#c4)" filter="url(#blur)"/>
  <rect width="1920" height="1080" fill="url(#c5)" filter="url(#blur)"/>
  <!-- Subtle prismatic lines -->
  <line x1="300" y1="0" x2="1600" y2="1080" stroke="white" stroke-opacity="0.02" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="1900" y2="1080" stroke="white" stroke-opacity="0.015" stroke-width="0.5"/>
  <line x1="0" y1="200" x2="1920" y2="600" stroke="white" stroke-opacity="0.018" stroke-width="0.5"/>
  <rect width="1920" height="1080" fill="url(#ref1)"/>
</svg>
