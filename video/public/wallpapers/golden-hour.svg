<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1035"/>
      <stop offset="20%" stop-color="#2d1b4e"/>
      <stop offset="40%" stop-color="#5c2d6e"/>
      <stop offset="60%" stop-color="#b44d3e"/>
      <stop offset="75%" stop-color="#d4763a"/>
      <stop offset="90%" stop-color="#2a1a40"/>
      <stop offset="100%" stop-color="#140e28"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="62%" r="30%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h1" cx="40%" cy="60%" r="25%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h2" cx="60%" cy="70%" r="22%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#sun)" filter="url(#blur)"/>
  <rect width="1920" height="1080" fill="url(#h1)" filter="url(#blur)"/>
  <rect width="1920" height="1080" fill="url(#h2)" filter="url(#blur)"/>
  <!-- Sun disc -->
  <ellipse cx="960" cy="670" rx="100" ry="100" fill="#fb923c" fill-opacity="0.08" filter="url(#blur)"/>
</svg>
