  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#o1)"/>
  <rect width="1920" height="1080" fill="url(#o2)"/>
  <rect width="1920" height="1080" fill="url(#o3)"/>
  <ellipse cx="960" cy="540" rx="900" ry="250" fill="#0891b2" fill-opacity="0.06" filter="url(#blur)"/>
  <!-- Caustic wave lines -->
  <path d="M0 500 Q200 480 480 510 Q700 530 960 500 Q1200 470 1440 505 Q1700 530 1920 490" stroke="#22d3ee" stroke-opacity="0.04" stroke-width="1.5" fill="none"/>
  <path d="M0 550 Q300 530 600 560 Q900 580 1200 545 Q1500 520 1920 555" stroke="#06b6d4" stroke-opacity="0.03" stroke-width="1" fill="none"/>
  <path d="M0 600 Q250 585 500 610 Q750 625 1000 595 Q1300 575 1600 605 Q1800 620 1920 600" stroke="#22d3ee" stroke-opacity="0.03" stroke-width="1" fill="none"/>
  <rect width="1920" height="1080" fill="url(#caustic)"/>
