<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020a18"/>
      <stop offset="25%" stop-color="#0a1929"/>
      <stop offset="50%" stop-color="#0d2847"/>
      <stop offset="70%" stop-color="#0a3157"/>
      <stop offset="100%" stop-color="#061a2e"/>
    </linearGradient>
    <radialGradient id="o1" cx="30%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o2" cx="70%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12"/>
